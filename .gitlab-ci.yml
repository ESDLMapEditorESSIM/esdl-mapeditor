stages:
  - build
  - test

variables:
  TAG: $CI_COMMIT_SHA
  BRANCH: $CI_COMMIT_REF_SLUG
  REGISTRY: ci.tno.nl
  IMAGE_BASE: ci.tno.nl/geis/esdl-mapeditor

# Switch to Google's public stable debug image tag
image: 
  name: gcr.io/kaniko-project/executor:v1.24.0-debug
  entrypoint: [""]

# ______    __    __   __   __       _______
#|   _  \  |  |  |  | |  | |  |     |       \
#|  |_)  | |  |  |  | |  | |  |     |  .--.  |
#|   _  <  |  |  |  | |  | |  |     |  |  |  |
#|  |_)  | |  `--'  | |  | |  `----.|  '--'  |
#|______/   \______/  |__| |_______||_______/

build-mapeditor:
  stage: build
  variables:
    IMAGE: $IMAGE_BASE/esdl-mapeditor
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
  script:
    - /kaniko/executor
      --context $CI_PROJECT_DIR
      --dockerfile docker/Dockerfile-uwsgi
      --build-arg git_commit=$TAG
      --cache=true
      --cache-repo $IMAGE/cache
      --destination $IMAGE:$TAG
      --destination $IMAGE:$BRANCH

build-mapeditor-gunicorn:
  stage: build
  variables:
    IMAGE: $IMAGE_BASE/esdl-mapeditor
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
  script:
    - /kaniko/executor
      --context $CI_PROJECT_DIR
      --dockerfile docker/Dockerfile-gunicorn
      --build-arg git_commit=$TAG
      --cache=true
      --cache-repo $IMAGE/cache
      --destination $IMAGE:$TAG-gunicorn
      --destination $IMAGE:$BRANCH-gunicorn

#.___________. _______     _______.___________.
#|           ||   ____|   /       |           |
#`---|  |----`|  |__     |   (----`---|  |----`
#    |  |     |   __|     \   \       |  |
#    |  |     |  |____.----)   |      |  |
#    |__|     |_______|_______/       |__|

test-mapeditor:
  stage: test
  image: $IMAGE_BASE/esdl-mapeditor:$TAG
  variables:                                                                                                                               
    DOCKER_AUTH_CONFIG: >-                                                                                                                 
      {"auths":{"ci.tno.nl":{"username":"${CI_REGISTRY_USER}","password":"${CI_REGISTRY_PASSWORD}"}}}
  except:
    variables:
      - $SKIP_TESTS == "true"
  retry: 1
  allow_failure: true
  script:
    - ./tests-entrypoint.sh
