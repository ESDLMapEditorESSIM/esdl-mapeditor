name: Docker Image CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  build-mapeditor:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build . --file docker/Dockerfile-gunicorn --tag esdl-mapeditor:ci
    - name: Run tests
      run: docker run --rm esdl-mapeditor:ci sh ./tests-entrypoint.sh
