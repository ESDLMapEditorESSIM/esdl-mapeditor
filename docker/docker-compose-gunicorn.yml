services:
  mapeditor:
    build:
      context: ..
      dockerfile: ./docker/Dockerfile-gunicorn
    image: esdl-mapeditor:gunicorn
    networks:
      - mapeditor-net
    volumes:
      - "../credentials/client_secrets_local-docker.json:/usr/src/app/credentials/client_secrets_local-docker.json"
    ports:
      - "${MAPEDITOR_PORT:-8111}:8111"
    env_file:
      - ../.env.local-docker
      - ../.env
#    extra_hosts:
#      - "host.docker.internal:host-gateway"


networks:
  mapeditor-net:
    external:
      name: mapeditor-net
