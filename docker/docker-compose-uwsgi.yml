version: "3.3"

services:
  mapeditor:
    build:
      context: ..
      dockerfile: ./docker/Dockerfile-uwsgi
    image: esdl-mapeditor:uwsgi
    networks:
      - mapeditor-net
      - nwn
    volumes:
      - "../credentials/client_secrets_local-docker.json:/usr/src/app/credentials/client_secrets_local-docker.json"
    ports:
      - "${MAPEDITOR_PORT:-8111}:8111"
    env_file:
      - ../.env.local-docker


networks:
  mapeditor-net:
    external:
      name: mapeditor-net
  nwn:
