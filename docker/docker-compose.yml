version: "3.3"

services:
  mapeditor:
    build:
      context: ..
      dockerfile: ./docker/Dockerfile-dev
    image: esdl-mapeditor:dev
    networks:
      - mapeditor-net
    volumes:
      - ..:/usr/src/app
    command: ["python", "-u", "app.py"]
    ports:
      - "${MAPEDITOR_PORT:-8111}:8111"
    env_file:
      - ../.env
      - ../.env.local-docker

  vue-watch:
    image: node:20
    working_dir: /usr/src/app
    volumes:
      - ..:/usr/src/app
    command: ["yarn", "run", "watch"]
    environment:
      - NODE_OPTIONS=--openssl-legacy-provider
      - NODE_ENV=development

networks:
  mapeditor-net:
    external:
      name: mapeditor-net
